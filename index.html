<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Prompt Library</h1>
            <p class="subtitle">Save and organize your prompts</p>
        </header>

        <main>
            <section class="form-section">
                <form id="promptForm">
                    <div class="form-group">
                        <label for="promptTitle">Prompt Title</label>
                        <input 
                            type="text" 
                            id="promptTitle" 
                            placeholder="Enter prompt title" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="promptContent">Prompt Content</label>
                        <textarea 
                            id="promptContent" 
                            placeholder="Enter prompt content" 
                            rows="6"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn-save">Save Prompt</button>
                </form>
            </section>

            <section class="prompts-section">
                <h2>Saved Prompts</h2>
                <div id="promptsContainer" class="prompts-grid">
                    <p class="empty-state">No prompts saved yet. Create your first prompt!</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
