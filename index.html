<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Prompt Library</h1>
            <p class="subtitle">Save and organize your prompts</p>
        </header>

        <main>
            <section class="form-section">
                <form id="promptForm">
                    <div class="form-group">
                        <label for="promptTitle">Prompt Title</label>
                        <input 
                            type="text" 
                            id="promptTitle" 
                            placeholder="Enter prompt title" 
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="promptContent">Prompt Content</label>
                        <textarea 
                            id="promptContent" 
                            placeholder="Enter prompt content" 
                            rows="6"
                            required
                        ></textarea>
                    </div>

                    <button type="submit" class="btn-save">Save Prompt</button>
                </form>

                <div class="export-import-bar">
                    <button id="exportBtn" class="btn-export">Export Prompts</button>
                    <input type="file" id="importFile" accept="application/json" style="display:none">
                    <button id="importBtn" class="btn-import">Import Prompts</button>
                    <span id="importStatus" class="import-status"></span>
                </div>
            </section>

            <section class="prompts-section">
                <h2>Saved Prompts</h2>
                <div id="promptsContainer" class="prompts-grid">
                    <p class="empty-state">No prompts saved yet. Create your first prompt!</p>
                </div>
            </section>
            <div id="mergeDialog" class="merge-dialog" style="display:none">
                <div class="merge-dialog-content">
                    <h3>Import Conflict Resolution</h3>
                    <p>Duplicate prompt IDs detected. How would you like to proceed?</p>
                    <button id="mergeReplaceBtn" class="btn-merge">Replace All</button>
                    <button id="mergeSkipBtn" class="btn-merge">Skip Duplicates</button>
                    <button id="mergeCancelBtn" class="btn-merge">Cancel</button>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
